backend:
  name: git-gateway
  branch: main

# Optional to turn on, but just requires more clicks to publish stuff
# publish_mode: editorial_workflow

collections:
  - name: "artists"
    label: "Artist bios"
    folder: "src/content/bios"
    create: true
    identifier_field: name
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: name, widget: string, hint: '' }
      - { label: "Genre", name: genre, widget: string, required: false }
      - { label: "Font", name: font, widget: select, options: ["cardo-regular", "cardo-regular-italic", "cardo-bold", "dela-gothic-one-regular"], required: false }
      - { label: "Color", name: color, widget: string, required: false, hint: 'Hex color code (e.g. #FF0000)' }
      - { label: "Image", name: photo, widget: object, fields: [{label: "Photo", name: src, widget: image, required: false}, {label: "Alternative text", name: alt, widget: string, required: false}]}
      - { label: "Links", name: links, widget: list, fields: [{ label: "Display text", name: name, widget: string}, {label: "Link", name: href, widget: string}], required: false}
      - { label: "Albums", name: albums, widget: list, required: false, fields: [
          { label: "Image", name: src, widget: image },
          { label: "Album name", name: name, widget: string, required: false },
          { label: "Link", name: href, widget: string, required: false }
        ]}
      - { label: "Video", name: video, widget: object, required: false, fields: [
          { label: "Video URL", name: src, widget: string },
          { label: "Alternative text", name: alt, widget: string, required: false }
        ]}
      - { label: "Background", name: background, widget: object, required: false, fields: [
          { label: "Image", name: src, widget: image},
          { label: "Offset X", name: offsetX, widget: number, required: false},
          { label: "Offset Y", name: offsetY, widget: number, required: false},
          { label: "Rotation", name: rotation, widget: number, required: false},
          { label: "Scale", name: scale, widget: number, required: false},
        ]}
      - { label: "Body", name: body, widget: markdown, required: false }

  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    identifier_field: title
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Images", name: images, widget: list, fields: [{label: "Image", name: image, widget: object, fields: [{label: "Image", name: src, widget: image}, {label: "Alternative text", name: alt, widget: string, required: false}], required: false}]}
      - { label: "Content", name: body, widget: markdown }

  - name: "archive"
    label: "Archive"
    folder: "src/content/archive"
    create: false
    identifier_field: title
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "hidden" }
      - { label: "Images", name: images, widget: list, required: false, fields: [
          { label: "Image", name: src, widget: image},
          { label: "Alternative text", name: alt, widget: string, required: false},
          { label: "Date", name: "date", widget: "datetime", required: false},
        ]}

media_folder: "public/images" # Location where files will be stored in the repo
public_folder: "/images" # The src attribute for uploaded media

site_url: https://mrtov-konj.netlify.app/
logo_url: https://mrtov-konj.netlify.app/favicon.svg
locale: 'mk'
