backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

collections:
  - name: "bands"
    label: "Band bios"
    folder: "src/content/bios"
    create: true
    fields:
      - { label: "Name", name: "name", widget: "string", hint: '' }
      - { label: "Slug", name: "slug", widget: "string", hint: 'The URL for the bio page is /bios/{slug}' }
      - { label: "Bio", name: bioText, widget: text, required: false }
      - { label: "Image", name: photo, widget: object, fields: [{label: "Bild", name: src, widget: image, required: false}, {label: "Alternativ text", name: alt, widget: string, required: false}]}
      - { label: "Links", name: links, widget: list, fields: [{ label: Name, name: name, widget: string}, {label: Link, name: href, widget: string}], required: false}

media_folder: "public/images" # Location where files will be stored in the repo
public_folder: "/images" # The src attribute for uploaded media

site_url: https://mrtov-konj.netlify.app/
logo_url: https://mrtov-konj.netlify.app/favicon.svg
locale: 'mk'
